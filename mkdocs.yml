# Theme configuration
theme:
  name: material
  language: zh
  # 墨墨头像（由 docs/img/mascot/neutral.png 裁头部缩放而来）
  logo: img/logo.png
  favicon: img/favicon.png
  palette:
    # 第一段是"跟随系统"，Material 靠它把 auto 模式还原成实际的
    # light/dark 取值。少了这一段，用户手动切过之后就没有办法回到
    # 跟随系统了。详见 Material 文档 Color scheme 一节。
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 跟随系统
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: orange
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  include_sidebar: true
  features:
    - content.code.copy
    - content.action.edit
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share

# Plugins
plugins:
  - search
  # Uncomment after running `pip install "mkdocs-material[imaging]"`:
  # - social
  # Uncomment after running `pip install mkdocs-glightbox`:
  # - glightbox:
  #     touchNavigation: true
  #     loop: false
  #     effect: zoom
  #     slide_effect: slide
  #     width: 100%
  #     height: auto
  #     zoomable: true
  #     draggable: true
  #     auto_caption: false
  #     caption_position: bottom
  #     skip_classes:
  #       - mascot-admonition-img   # keep mascot poses out of the lightbox gallery

# Markdown extensions
markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: false   # 上线清单用不可点击的方框，避免误导读者以为能勾
  # Currency-safe math: inline is \(...\) only, never single $. Run
  # book-installer feature 5 (KaTeX) to add the renderer.
  - pymdownx.arithmatex:
      generic: true
      inline_syntax: ['round']
      block_syntax: ['dollar', 'square']

# Custom CSS — file is created by init-textbook
extra_css:
  - css/extra.css
  - css/mascot.css

# Custom JavaScript — uncomment once a corresponding file exists
# extra_javascript:
#   - js/extra.js

# Exclude prompt scratch files and TODOs from build/search/sitemap
exclude_docs: |
  # 以下文件是给 AI agent 与作者用的工作文档，不面向读者，故排除
  # BUILDING-SIMS.md 是 MicroSim 施工规范；cover-image-prompt.md 是封面提示词
  **/image-prompt*.md
  **/image-prompts*.md
  **/cover-prompt.md
  **/cover-image-prompt.md
  **/TODO.md
  img/mascot/character-sheet.md
  BUILDING-SIMS.md
  # social/ 是宣传物料（LinkedIn 帖、新闻稿），不对读者展示
  social/
  # 以下 5 份是上游脚本自动生成的英文报告原稿。仓库保留它们作为中文译版的对照
  # 与再生成依据，但不发布到网站。
  learning-graph/quality-metrics.md
  learning-graph/taxonomy-distribution-report.md
  learning-graph/book-metrics.md
  learning-graph/chapter-metrics.md
  learning-graph/mascot-test.md

# Rebuild on changes during `mkdocs serve`
watch:
  - docs
  - mkdocs.yml

# Extra
extra:
  # Suppress the "Made with Material for MkDocs" footer line
  generator: false

  # MicroSim build-status indicators shown next to nav entries.
  # The status value is set per-page in the index.md frontmatter:
  #   status: scaffold | built | implemented | instrumented | approved
  # `instrumented` = the sim carries xAPI event handling (main.html loads lrs-sim.js and
  # the code calls LRSSim.create); the add-xapi-events-to-microsim skill's
  # scripts/sync-status.py sets it. Its icon is always the teal "signal" (MDI access-point).
  # Colors are defined as CSS custom properties in docs/css/extra.css.
  # Note: `theme.icon.status` is a Material Insiders feature and is silently
  # ignored on community Material. Do not add it — the CSS-variable approach
  # in extra.css is the load-bearing piece on the community edition.
  status:
    scaffold: Scaffold — placeholder, not yet implemented
    built: Built — implementation complete, awaiting review
    implemented: Implemented — the MicroSim works
    instrumented: Instrumented — the MicroSim emits xAPI events; add ?xapi=teaching to the URL to see them
    approved: Approved — tested and approved

  # Intelligent-textbook URI scheme (see
  # https://dmccreary.github.io/intelligent-textbooks/uri-scheme/)
  schema: https://dmccreary.github.io/intelligent-textbooks/ns/textbook/v1
  textbook_name: '高级AI大模型应用开发'
  textbook_version: '0.1'

  # Google Analytics — uncomment once a property ID exists:
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX
