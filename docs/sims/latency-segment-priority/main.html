<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>延迟分段瀑布与优化优先级 MicroSim</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        body { margin: 0px; padding: 0px; font-family: Arial, Helvetica, sans-serif; color: #1a1a1a; }
        main { width: 100%; }
        .chart-area { width: 100%; position: relative; }
        .panel { box-sizing: border-box; width: 100%; overflow-y: auto; }
        .status { font-size: 16px; font-weight: bold; line-height: 22px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px 14px; }
        .cell { height: 40px; }
        .cell .clbl { display: block; font-size: 14px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cell .crow { display: flex; align-items: center; gap: 4px; }
        .cell input[type=range] { flex: 1 1 auto; min-width: 0; height: 20px; }
        .cell .cval { flex: 0 0 66px; font-size: 14px; font-weight: bold; text-align: right; }
        .row { display: flex; align-items: center; height: 30px; gap: 8px; }
        .row .lbl { flex: 0 0 372px; font-size: 16px; white-space: nowrap; }
        .row .q { flex: 0 0 432px; font-size: 14px; white-space: nowrap; color: #333; }
        .row .q2 { flex: 0 0 210px; font-size: 14px; white-space: nowrap; color: #333; }
        .row select { font-size: 15px; min-width: 172px; height: 24px; }
        .row select.sel-sm { min-width: 0; width: 148px; }
        .row input[type=number] { width: 88px; font-size: 15px; height: 24px; }
        .row .unit { font-size: 14px; color: #444; }
        button { font-size: 15px; padding: 3px 10px; height: 26px; }
        .readout { font-size: 15px; line-height: 19px; border: 1px solid #c8c8c8; background: #f6f8fb; padding: 2px 6px; overflow: hidden; }
        .readout .ok { color: #17603a; font-weight: bold; }
        .readout .no { color: #9c2f0d; font-weight: bold; }
        table.act { border-collapse: collapse; width: 100%; font-size: 14px; }
        table.act th, table.act td { border: 1px solid #bbb; padding: 0 3px; text-align: center; height: 22px; line-height: 22px; white-space: nowrap; }
        table.act th { background: #e8eef6; font-weight: bold; }
        table.act td.name { text-align: left; padding-left: 5px; }
        .fb { font-size: 15px; line-height: 19px; color: #1a1a1a; overflow-y: auto; }
        .fb .ok { color: #17603a; font-weight: bold; }
        .fb .no { color: #9c2f0d; font-weight: bold; }
        @media (max-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 430px) { .grid { grid-template-columns: 1fr; } }
    </style>
    <script src="latency-segment-priority.js"></script>
</head>
<body>
    <main>
        <div class="chart-area" id="chartArea"></div>
        <div class="panel" id="panel"></div>
    </main>
    <br/>
    <a href=".">返回文档</a>
</body>
</html>
