<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据成本优化阶梯与月成本 MicroSim</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        body { margin: 0px; padding: 0px; font-family: Arial, Helvetica, sans-serif; color: #1a1a1a; }
        main { width: 100%; }
        .chart-area { width: 100%; position: relative; }
        .panel { box-sizing: border-box; width: 100%; overflow-y: auto; }
        .status { font-size: 16px; font-weight: bold; line-height: 22px; }
        .row { display: flex; align-items: center; height: 30px; gap: 8px; }
        .row .lbl { flex: 0 0 372px; font-size: 16px; white-space: nowrap; }
        .row .q { flex: 0 0 400px; font-size: 14px; white-space: nowrap; color: #333; }
        .row .q-rank { flex: 0 0 250px; font-size: 14px; white-space: nowrap; color: #333; }
        .row input[type=range] { flex: 1 1 auto; min-width: 120px; }
        .row .val { flex: 0 0 90px; font-size: 16px; font-weight: bold; text-align: right; }
        .row select { font-size: 15px; height: 24px; width: 152px; }
        .row select.sel-rk { font-size: 14px; height: 24px; width: 132px; }
        .row input[type=number] { width: 88px; font-size: 15px; height: 24px; }
        .row .unit { font-size: 14px; color: #444; }
        button { font-size: 15px; padding: 3px 10px; height: 26px; }
        .readout { font-size: 15px; line-height: 19px; border: 1px solid #c8c8c8; background: #f6f8fb; padding: 2px 6px; overflow: hidden; }
        .readout .ok { color: #17603a; font-weight: bold; }
        .readout .no { color: #9c2f0d; font-weight: bold; }
        table.ladder { border-collapse: collapse; width: 100%; font-size: 13px; table-layout: fixed; }
        table.ladder th, table.ladder td { border: 1px solid #bbb; padding: 0 3px; text-align: center; height: 22px; line-height: 22px; white-space: nowrap; }
        table.ladder th { background: #e8eef6; font-weight: bold; }
        table.ladder td.name { text-align: left; padding-left: 5px; }
        table.ladder input[type=checkbox] { width: 15px; height: 15px; vertical-align: middle; }
        .fb { font-size: 15px; line-height: 19px; color: #1a1a1a; overflow-y: auto; }
        .fb .ok { color: #17603a; font-weight: bold; }
        .fb .no { color: #9c2f0d; font-weight: bold; }
    </style>
    <script src="cost-optimization-ladder.js"></script>
</head>
<body>
    <main>
        <div class="chart-area" id="chartArea"></div>
        <div class="panel" id="panel"></div>
    </main>
    <br/>
    <a href=".">返回文档</a>
</body>
</html>
