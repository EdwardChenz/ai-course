<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跨 Agent 任务交接状态同步 MicroSim</title>
    <script src="https://cdn.jsdelivr.net/npm/vis-timeline@7.7.3/standalone/umd/vis-timeline-graph2d.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0px;
            padding: 0px;
            font-family: Arial, "Microsoft YaHei", Helvetica, sans-serif;
            font-size: 14px;
            color: #102027;
            background: #ffffff;
        }
        #timeline {
            width: 100%;
            height: 210px;
            border: 1px solid #b0bec5;
            background: #f7fbff;
        }
        /* 左侧分组名列收窄，把宽度让给时间轴 */
        #timeline .vis-labelset { width: 190px; }
        #timeline .vis-labelset .vis-label {
            max-width: 190px;
            padding: 2px 4px;
            font-size: 12px;
            white-space: normal;
            line-height: 1.25;
        }
        #timeline .vis-item { font-size: 12px; }
        #ledger {
            height: 84px;
            padding: 6px 12px;
            border-left: none;
            border-right: none;
            line-height: 1.5;
            font-size: 14px;
            overflow-y: auto;
        }
        #events {
            height: 234px;
            margin: 0 12px;
            border: 1px solid #b0bec5;
            overflow-y: auto;
            font-size: 12px;
        }
        #events table {
            width: 100%;
            border-collapse: collapse;
            line-height: 1.25;
        }
        #events th, #events td {
            padding: 1px 4px;
            border-bottom: 1px solid #eceff1;
            text-align: left;
            white-space: nowrap;
        }
        #feedback {
            height: 112px;
            margin: 0 12px;
            padding: 4px 6px;
            border: 1px solid #b0bec5;
            border-top: none;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.45;
        }
        #events th {
            position: sticky;
            top: 0;
            background: #eceff1;
        }
        #events tr.sel td { background: #fff59d; }
        #events td.num { text-align: right; }
        #events tr.rb td { background: #ffebee; }
        #events tr.idem td { background: #fff8e1; }
        #controls {
            height: 120px;
            padding: 8px 10px 6px 10px;
            border: 1px solid #b0bec5;
            border-top: none;
            background: #fafafa;
        }
        .row {
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 8px;
            height: 30px;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
        }
        .row + .row { margin-top: 8px; }
        .row label { flex: 0 0 auto; }
        button { flex: 0 0 auto; font-size: 14px; padding: 3px 8px; cursor: pointer; }
        button:disabled { cursor: not-allowed; opacity: 0.45; }
        select, input { flex: 0 0 auto; font-size: 14px; padding: 3px 4px; }
        #timeoutSlider { flex: 1 1 200px; min-width: 120px; }
        #q1Input { width: 60px; }
        #q2Input { width: 70px; }
        #verdict {
            margin-left: auto;
            padding-left: 10px;
            flex: 0 0 auto;
        }
        .ok { color: #1b5e20; font-weight: bold; }
        .no { color: #b71c1c; font-weight: bold; }
        .hint { color: #37474f; }
    </style>
    <script src="task-handoff-state-timeline.js" defer></script>
</head>
<body>
    <main>
        <div id="timeline" role="img" aria-label="一次理赔委托的十二条状态事件时间轴，事件表与判定结果见下方表格"></div>
        <div id="ledger" aria-live="polite"></div>
        <div id="events"></div>
        <div id="feedback" aria-live="polite"></div>
        <div id="controls">
            <div class="row">
                <label for="timeoutSlider">超时阈值 deadline_ms</label>
                <input id="timeoutSlider" type="range" min="500" max="5000" step="100" value="2000" aria-label="超时阈值，单位毫秒">
                <span id="timeoutValue">2000 ms</span>
                <button id="focusBtn" type="button">聚焦回退</button>
                <button id="fitBtn" type="button">显示全部</button>
                <button id="zoomInBtn" type="button" aria-label="放大">＋</button>
                <button id="zoomOutBtn" type="button" aria-label="缩小">－</button>
            </div>
            <div class="row">
                <label for="q1Input">1｜回退序号</label>
                <input id="q1Input" type="number" min="1" max="12" step="1" placeholder="序号" aria-label="第1题：必须丢弃的回退事件序号">
                <label for="q2Input">2｜重复扣费(分)</label>
                <input id="q2Input" type="number" min="0" max="10" step="0.1" placeholder="分" aria-label="第2题：接受该回退后的重复扣费金额，单位分">
                <label for="q3Input">3｜延迟到达判超时</label>
                <select id="q3Input" aria-label="第3题：延迟到达是否判超时">
                    <option value="">请选择</option>
                    <option value="no">不应判超时</option>
                    <option value="yes">应判超时</option>
                </select>
            </div>
            <div class="row">
                <button id="submitBtn" type="button">提交判定</button>
                <button id="retryBtn" type="button">重做本轮</button>
                <button id="answerBtn" type="button">显示答案</button>
                <button id="resetBtn" type="button">重来</button>
                <span id="verdict" aria-live="polite"></span>
            </div>
        </div>
    </main>
    <br/>
    <a href=".">返回文档</a>
</body>
</html>
