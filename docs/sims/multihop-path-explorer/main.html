<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多跳推理路径演示器 MicroSim</title>
    <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0px;
            padding: 0px;
            font-family: Arial, "Microsoft YaHei", Helvetica, sans-serif;
            font-size: 14px;
            color: #102027;
            background: #ffffff;
        }
        #graph {
            width: 100%;
            height: 380px;
            border: 1px solid #b0bec5;
            background: #f7fbff;
        }
        #panel {
            height: 210px;
            padding: 6px 12px;
            border: 1px solid #b0bec5;
            border-top: none;
            border-left: none;
            border-right: none;
            overflow-y: auto;
            line-height: 1.55;
            font-size: 14px;
        }
        #controls {
            height: 84px;
            padding: 8px 10px 6px 10px;
            border: 1px solid #b0bec5;
            border-top: none;
            border-left: none;
            border-right: none;
            border-bottom: none;
            background: #fafafa;
        }
        .row {
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 8px;
            height: 30px;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
        }
        .row + .row { margin-top: 8px; }
        .row label { flex: 0 0 auto; }
        button {
            flex: 0 0 auto;
            font-size: 14px;
            padding: 3px 8px;
            cursor: pointer;
        }
        button:disabled { cursor: not-allowed; opacity: 0.45; }
        select, input {
            flex: 0 0 auto;
            font-size: 14px;
            padding: 3px 4px;
        }
        #hopInput { width: 56px; }
        #setInput { flex: 1 1 130px; min-width: 88px; }
        .chip {
            display: inline-block;
            min-width: 26px;
            text-align: center;
            padding: 2px 5px;
            margin-right: 4px;
            border: 1px solid #90a4ae;
            border-radius: 3px;
            background: #eceff1;
            cursor: pointer;
            font-size: 13px;
        }
        .chip.ok { background: #c8e6c9; border-color: #2e7d32; }
        .chip.no { background: #ffcdd2; border-color: #c62828; }
        .chip.locked { background: #fff9c4; border-color: #f9a825; }
        .ok { color: #1b5e20; font-weight: bold; }
        .no { color: #b71c1c; font-weight: bold; }
        .hint { color: #37474f; }
    </style>
    <script src="multihop-path-explorer.js" defer></script>
</head>
<body>
    <main>
        <div id="graph" role="img" aria-label="示例图谱：8 个节点、12 条有向边，可点击节点查看定义与属性"></div>
        <div id="panel" aria-live="polite"></div>
        <div id="controls">
            <div class="row">
                <label for="seedSelect">起点</label>
                <select id="seedSelect" aria-label="选择展开起点节点"></select>
                <button id="expandBtn" type="button">展开下一跳</button>
                <button id="collapseBtn" type="button">收回全部</button>
                <button id="startBtn" type="button">开始挑战</button>
                <button id="fitBtn" type="button">适配视图</button>
                <button id="zoomInBtn" type="button" aria-label="放大">＋</button>
                <button id="zoomOutBtn" type="button" aria-label="缩小">－</button>
            </div>
            <div class="row">
                <label for="hopInput">跳数</label>
                <input id="hopInput" type="number" min="1" max="3" step="1" placeholder="跳" aria-label="预测跳数" disabled>
                <label for="setInput">结果集</label>
                <input id="setInput" type="text" placeholder="多个实体用顿号分隔" aria-label="预测返回的实体集" disabled>
                <button id="submitBtn" type="button" disabled>提交预测</button>
                <button id="retryBtn" type="button" disabled>重预测错题</button>
                <button id="answerBtn" type="button" disabled>显示答案</button>
                <button id="resetBtn" type="button">重来</button>
                <span id="chips"></span>
            </div>
        </div>
    </main>
    <br/>
    <a href=".">返回文档</a>
</body>
</html>
